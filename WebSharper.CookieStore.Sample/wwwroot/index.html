<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cookie Store API Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="Content/WebSharper.CookieStore.Sample.css" />
    <style>
        /* Don't show the not-yet-loaded templates */
        [ws-template], [ws-children-template] { display: none; }
    </style>
    <script type="module" src="Content/WebSharper.CookieStore.Sample.head.js"></script>
</head>
<body>
    <h1>Cookie Store API Demo</h1>
    <div id="main" ws-children-template="Main">
        <p>
            <input type="text" id="nameInput" placeholder="Cookie name" ws-var="nameInput" />
            <input type="text" id="valueInput" placeholder="Cookie value" ws-var="valueInput" />
        </p>
        <p>
            <button ws-onclick="setCookie">Set Cookie</button>
            <button ws-onclick="getCookie">Get Cookie</button>
            <button ws-onclick="deleteCookie">Delete Cookie</button>
            <button ws-onclick="getAllCookies">List All Cookies</button>
        </p>

        <p id="status">${Status}</p>
        <ul id="cookies" ws-hole="Cookies"></ul>
    </div>
    <script type="module" src="Content/WebSharper.CookieStore.Sample.min.js"></script>
</body>
</html>
